# geo-api 独立一键部署（含 Mongo）
# 用法：在本目录 cp .env.example .env && docker compose up -d --build
name: geo-api

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - geo_api_mongo:/data/db
    networks: [geo]

  api:
    build:
      context: ../..
      dockerfile: apps/geo-api/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      EGG_SERVER_ENV: prod
      PORT: "6001"
      BIND_HOST: "0.0.0.0"
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/geo}
    ports:
      - "${API_PORT:-6001}:6001"
    depends_on: [mongo]
    networks: [geo]

networks:
  geo:

volumes:
  geo_api_mongo:
