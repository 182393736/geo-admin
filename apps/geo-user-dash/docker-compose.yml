# geo-user-dash 独立一键部署
# 用法：cp .env.example .env && docker compose up -d --build
name: geo-dash

services:
  dash:
    build:
      context: ../..
      dockerfile: apps/geo-user-dash/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE}
        VITE_ARTICLE_BASE: ${VITE_ARTICLE_BASE}
        VITE_SITE_URL: ${VITE_SITE_URL}
        VITE_USE_MOCK: "false"
    restart: unless-stopped
    ports:
      - "${DASH_PORT:-6002}:80"
