# 管理总后台 geo-admin（:6004）
# 一键：bash deploy/up-admin.sh

name: geo-mgmt

services:
  geo-admin:
    build:
      context: ../..
      dockerfile: apps/geo-admin/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-https://geo-api.hanyuai.com}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-6004}:80"
