# 官网 + 用户后台同域（方案①路径分流）
# 用法：拷到宿主机 Nginx（如 /etc/nginx/conf.d/），按实际证书/upstream 改后 reload。
#
# 约定：
#   site-web  → 127.0.0.1:5003
#   dash-v2   → 127.0.0.1:5180
#   Host      → geo.hanyuai.com（测试换 test-geo.hanyuai.com）
#
# 必须把 /assets/ 也指到 dash：Vite 构建产物在根路径 /assets/*，
# 只反代 /dashboard 会导致后台白屏。官网 Nuxt 用 /_nuxt/，一般不冲突。

upstream geo_site_web {
  server 127.0.0.1:5003;
  keepalive 16;
}

upstream geo_dash_v2 {
  server 127.0.0.1:5180;
  keepalive 16;
}

# —— 主站：官网 + 工作台 ——
server {
  listen 443 ssl http2;
  server_name geo.hanyuai.com;

  # ssl_certificate     /path/to/fullchain.pem;
  # ssl_certificate_key /path/to/privkey.pem;

  client_max_body_size 32m;

  # 用户后台 SPA 路由 + 静态资源
  location ^~ /assets/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://geo_dash_v2;
  }

  location ^~ /dashboard {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://geo_dash_v2;
  }

  location ^~ /trial {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://geo_dash_v2;
  }

  location ^~ /login {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://geo_dash_v2;
  }

  # 其余 → 官网（Nuxt SSR）
  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://geo_site_web;
  }
}

server {
  listen 80;
  server_name geo.hanyuai.com;
  return 301 https://$host$request_uri;
}

# —— 旧用户后台域名：整站 301 到同域路径 ——
server {
  listen 443 ssl http2;
  server_name geo-user-dash.hanyuai.com;

  # ssl_certificate     /path/to/fullchain.pem;
  # ssl_certificate_key /path/to/privkey.pem;

  return 301 https://geo.hanyuai.com$request_uri;
}

server {
  listen 80;
  server_name geo-user-dash.hanyuai.com;
  return 301 https://geo.hanyuai.com$request_uri;
}
