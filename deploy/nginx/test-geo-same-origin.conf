# 测试环境同域分流（与 geo-same-origin.conf 相同逻辑）
# Host: test-geo.hanyuai.com
# 旧后台: test-geo-user-dash.hanyuai.com → 301

upstream test_geo_site_web {
  server 127.0.0.1:5003;
  keepalive 16;
}

upstream test_geo_dash_v2 {
  server 127.0.0.1:5180;
  keepalive 16;
}

server {
  listen 443 ssl http2;
  server_name test-geo.hanyuai.com;

  # ssl_certificate     /path/to/fullchain.pem;
  # ssl_certificate_key /path/to/privkey.pem;

  client_max_body_size 32m;

  location ^~ /assets/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://test_geo_dash_v2;
  }

  location ^~ /dashboard {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://test_geo_dash_v2;
  }

  location ^~ /trial {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://test_geo_dash_v2;
  }

  location ^~ /login {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://test_geo_dash_v2;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://test_geo_site_web;
  }
}

server {
  listen 80;
  server_name test-geo.hanyuai.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name test-geo-user-dash.hanyuai.com;
  # ssl_certificate     /path/to/fullchain.pem;
  # ssl_certificate_key /path/to/privkey.pem;
  return 301 https://test-geo.hanyuai.com$request_uri;
}

server {
  listen 80;
  server_name test-geo-user-dash.hanyuai.com;
  return 301 https://test-geo.hanyuai.com$request_uri;
}
