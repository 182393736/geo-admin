# 官网 + 用户后台 + CMS 管理端
# 一键：bash deploy/up-web.sh
# 端口映射一律「宿主机=容器内」（便于记忆）

name: geo-web

services:
  site-web:
    build:
      context: ../..
      dockerfile: apps/site-web/Dockerfile
      args:
        NUXT_API_BASE: ${NUXT_API_BASE:-https://geo-site-api.hanyuai.com}
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://geo-site-api.hanyuai.com}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://geo.hanyuai.com}
        NUXT_PUBLIC_CONSOLE_URL: ${NUXT_PUBLIC_CONSOLE_URL:-https://geo.hanyuai.com}
        NUXT_PUBLIC_GEO_API_BASE: ${NUXT_PUBLIC_GEO_API_BASE:-/geo-api}
        NUXT_GEO_API_TARGET: ${NUXT_GEO_API_TARGET:-https://geo-api.hanyuai.com}
    restart: unless-stopped
    ports:
      - "${SITE_WEB_PORT:-5003}:5003"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5003"
      NITRO_PORT: "5003"

  dash-v2:
    build:
      context: ../..
      dockerfile: apps/geo-user-dash-v2/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-https://geo-api.hanyuai.com}
        VITE_ARTICLE_BASE: ${VITE_ARTICLE_BASE:-https://geo-api.hanyuai.com}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://geo.hanyuai.com}
    restart: unless-stopped
    ports:
      - "${DASH_PORT:-5180}:5180"

  site-admin:
    build:
      context: ../..
      dockerfile: apps/site-admin/Dockerfile
    restart: unless-stopped
    ports:
      - "${SITE_ADMIN_PORT:-5002}:5002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
